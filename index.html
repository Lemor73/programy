        let frazaSzukania = "";

        function ucieknijHTML(t) {
            if (!t) return "";
            return t.replace(/[&<>'"]/g, z => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[z] || z));
        }

        function przewinDo(id) {
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth' });
        }

        function renderuj() {
            const katBox = document.getElementById("categories-container");
            const wrapper = document.getElementById("sections-wrapper");
            katBox.innerHTML = "";
            wrapper.innerHTML = "";
            let widoczneKarty = 0;

            DANE.categories.forEach(kat => {
                const idSekcji = 'sekcja-' + kat.id;
                const btn = document.createElement("button");
                btn.className = "cat-btn";
                btn.textContent = kat.title;
                btn.onclick = () => przewinDo(idSekcji);
                katBox.appendChild(btn);

                const programy = DANE.tools.filter(t => t.catId === kat.id);
                const pasujace = programy.filter(t => {
                    if (frazaSzukania.trim() === "") return true;
                    const q = frazaSzukania.toLowerCase();
                    const lic = (t.license || '').toLowerCase();
                    const isRec = t.recommended ? 'polecam polecane' : '';
                    return t.title.toLowerCase().includes(q) || 
                           t.desc.toLowerCase().includes(q) || 
                           lic.includes(q) ||
                           isRec.includes(q) ||
                           kat.title.toLowerCase().includes(q) ||
                           (kat.desc && kat.desc.toLowerCase().includes(q));
                });

                if (frazaSzukania.trim() !== "" && pasujace.length === 0) return;
                widoczneKarty += pasujace.length;

                const sekcja = document.createElement("section");
                sekcja.id = idSekcji;
                sekcja.className = "category-section";

                let kartyHTML = "";
                pasujace.forEach(prog => {
                    const badgeHTML = prog.license ? `<span class="badge">${ucieknijHTML(prog.license)}</span>` : '';
                    const recHTML = prog.recommended ? `<span class="badge badge-recommended">★ POLECAM</span>` : '';
                    
                    kartyHTML += `
                        <a href="${ucieknijHTML(prog.url)}" target="_blank" rel="noopener noreferrer" class="card">
                            <div class="card-header-row">
                                <h3>${ucieknijHTML(prog.title)}</h3>
                                <div class="card-badges">
                                    ${recHTML}
                                    ${badgeHTML}
                                </div>
                            </div>
                            <p>${ucieknijHTML(prog.desc)}</p>
                        </a>
                    `;
                });

                sekcja.innerHTML = `
                    <div class="section-header">
                        <h2>${ucieknijHTML(kat.title)}</h2>
                        ${kat.desc ? `<p class="section-desc">${ucieknijHTML(kat.desc)}</p>` : ''}
                    </div>
                    <div class="grid">${kartyHTML}</div>
                `;
                wrapper.appendChild(sekcja);
            });

            if (frazaSzukania.trim() !== "" && widoczneKarty === 0) {
                wrapper.innerHTML = '<div class="empty-state">Brak wyników wyszukiwania.</div>';
            }
        }

        document.getElementById("search-input").addEventListener("input", (e) => {
            frazaSzukania = e.target.value;
            renderuj();
        });
        renderuj();
    </script>
